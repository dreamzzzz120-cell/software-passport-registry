name: wire-report-schedules
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3
        with:
          fetch-depth: 0
      - name: Wire route
        shell: python
        run: |
          from pathlib import Path
          p=Path('server.ts'); s=p.read_text()
          imp="import { createReportSchedulesRouter } from './src/routes/report-schedules.ts';"
          if imp not in s:
              marker="import { createCommercialRouter } from './src/routes/commercial.ts';"
              s=s.replace(marker,marker+'\n'+imp,1)
          mount="app.use('/api/report-schedules', requireAuth, createReportSchedulesRouter());"
          if mount not in s:
              marker="app.use('/api/remediation-tasks', requireAuth, createRemediationTasksRouter());"
              s=s.replace(marker,marker+'\n'+mount,1)
          p.write_text(s)
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git diff --cached --check
          git rm .github/workflows/wire-report-schedules.yml
          git commit -m "feat: wire scheduled report API"
          git push
