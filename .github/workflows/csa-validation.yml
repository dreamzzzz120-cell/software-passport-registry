name: Continuous Software Assurance Validation

on:
  pull_request:
    paths:
      - "scripts/continuous-software-assurance.mjs"
      - "package.json"
      - "src/routes/monitoring.ts"
      - "src/db/schema.ts"
      - "src/components/ClientsView.tsx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check scripts/continuous-software-assurance.mjs
      - run: npm run typecheck
