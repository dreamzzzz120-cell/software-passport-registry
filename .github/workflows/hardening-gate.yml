name: Hardening Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel an in-flight hardening run just because another hardening-triggering
# commit arrived. A cancelled install step is not a security result and must not be
# mistaken for a passing release verification.
concurrency:
  group: hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Type safety
        run: npm run typecheck

      - name: Tests
        run: npm test -- --reporter=dot

      - name: Production build
        run: npm run build

      # See scripts/audit-with-retry.mjs: retries only an unreachable npm audit
      # endpoint, never a finding, and fails closed if no report is produced.
      - name: Dependency audit
        run: node scripts/audit-with-retry.mjs --omit=dev --audit-level=critical

      - name: Block committed private-key material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' -- ':!package-lock.json'; then
            echo 'Private-key material detected in tracked source.'
            exit 1
          fi

      - name: Verify no production env file is tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.env\.production|\.env\.local)$'; then
            echo 'Production/local environment file is tracked.'
            exit 1
          fi
