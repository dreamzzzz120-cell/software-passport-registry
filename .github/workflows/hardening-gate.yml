name: Hardening Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Finalize AI claim guard boundary
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[ai-guard-finalized]') }}
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/utils/scanner.ts')
          s = p.read_text()
          marker = "\n    // Write final summary and calculated scores back to database"
          if marker in s:
              before, after = s.split(marker, 1)
              if not before.rstrip().endswith('}'):
                  s = before + "\n    }" + marker + after
                  p.write_text(s)
          if "from '../security/ai-claim-guard.ts'" not in s:
              raise SystemExit('AI claim guard import missing')
          if 'AI_SUMMARY_REJECTED_UNSUPPORTED_CLAIM' not in s:
              raise SystemExit('AI rejection audit missing')
          if 'AI_SUMMARY_PUBLISHED' not in s:
              raise SystemExit('AI publish audit missing')
      - name: Commit AI boundary finalization
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[ai-guard-finalized]') }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/scanner.ts
          if git diff --cached --quiet; then
            echo 'No scanner changes required.'
          else
            git commit -m 'fix: finalize AI claim guard scanner boundary [ai-guard-finalized]'
            git push
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type safety
        run: npm run typecheck

      - name: Tests
        run: npm test -- --reporter=dot

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Block committed private-key material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' -- ':!package-lock.json'; then
            echo 'Private-key material detected in tracked source.'
            exit 1
          fi

      - name: Verify no production env file is tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.env\.production|\.env\.local)$'; then
            echo 'Production/local environment file is tracked.'
            exit 1
          fi
