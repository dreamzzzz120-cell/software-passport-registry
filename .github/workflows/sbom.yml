name: SBOM Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Verify lockfile install
        run: npm ci --ignore-scripts
      - name: Generate dependency SBOM
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application > sbom.json
      - name: Validate SBOM is non-empty
        shell: bash
        run: |
          set -euo pipefail
          test -s sbom.json
          node -e "const s=require('./sbom.json'); if(!s.components || !Array.isArray(s.components)) process.exit(1); console.log('SBOM components:', s.components.length)"
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spr-sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 14
