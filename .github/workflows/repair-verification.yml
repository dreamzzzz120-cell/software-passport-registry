name: Repair verification integration runner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair authoritative verification integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('src/App.tsx'); s=p.read_text(encoding='utf-8')
          once('src/App.tsx', "import type { Alert, Client, Integration, Scan, SoftwarePassport, Vendor } from './types';", "import type { Alert, Client, Integration, Scan, SoftwarePassport, Vendor } from './types';\nimport type { VerificationDecision } from './lib/verification/evaluateVerification.ts';")
          once('src/App.tsx', "const [theme, setTheme] = useState<'light' | 'dark'>('dark');", "const [theme, setTheme] = useState<'light' | 'dark'>('dark');\n  const [verificationDecisions, setVerificationDecisions] = useState<Record<string, VerificationDecision>>({});\n  const [verificationDetails, setVerificationDetails] = useState<Record<string, unknown>>({});")
          once('src/App.tsx', "apiFetch('/api/user/me'), apiFetch('/api/scans'), apiFetch('/api/trust-loop/findings'), apiFetch('/api/user/passports'), apiFetch('/api/user/clients'), apiFetch('/api/integrations'),", "apiFetch('/api/user/me'), apiFetch('/api/scans'), apiFetch('/api/trust-loop/findings'), apiFetch('/api/user/passports'), apiFetch('/api/user/clients'), apiFetch('/api/integrations'), apiFetch('/api/user/verification'),")
          once('src/App.tsx', "const [me, scansResponse, findingsResponse, passportsResponse, clientsResponse, integrationsResponse] = responses;", "const [me, scansResponse, findingsResponse, passportsResponse, clientsResponse, integrationsResponse, verificationResponse] = responses;\n      if (verificationResponse.ok) { const data = await verificationResponse.json().catch(() => null); if (!cancelled) { setVerificationDecisions(data?.verificationDecisions && typeof data.verificationDecisions === 'object' ? data.verificationDecisions : {}); setVerificationDetails(data?.verificationDetails && typeof data.verificationDetails === 'object' ? data.verificationDetails : {}); } } else if (!cancelled) { setVerificationDecisions({}); setVerificationDetails({}); }")
          once('src/App.tsx', "<PassportsView passports={passports}", "<PassportsView verificationDecisions={verificationDecisions} verificationDetails={verificationDetails} passports={passports}")
          once('src/App.tsx', "<MSPCommandCenter clients={clients}", "<MSPCommandCenter verificationDecisions={verificationDecisions} verificationDetails={verificationDetails} clients={clients}")
          p.write_text(s,encoding='utf-8')

          p=Path('src/components/PassportsView.tsx'); s=p.read_text(encoding='utf-8')
          once('src/components/PassportsView.tsx', "import type { Client, SoftwarePassport } from '../types';", "import type { Client, SoftwarePassport } from '../types';\nimport type { VerificationDecision } from '../lib/verification/evaluateVerification';")
          once('src/components/PassportsView.tsx', "  role?: string;\n}", "  role?: string;\n  verificationDecisions?: Record<string, VerificationDecision>;\n  verificationDetails?: Record<string, unknown>;\n}")
          once('src/components/PassportsView.tsx', "export default function PassportsView({ passports, selectedPassportId, setSelectedPassportId, searchQuery, onNavigateTab, clients = [], assets = [], role = 'Viewer' }: PassportsViewProps) {", "export default function PassportsView({ passports, selectedPassportId, setSelectedPassportId, searchQuery, onNavigateTab, clients = [], assets = [], role = 'Viewer', verificationDecisions = {}, verificationDetails = {} }: PassportsViewProps) {")
          once('src/components/PassportsView.tsx', "  const selected = useMemo(() => passports.find((p) => p.id === selectedPassportId) ?? null, [passports, selectedPassportId]);", "  const selected = useMemo(() => passports.find((p) => p.id === selectedPassportId) ?? null, [passports, selectedPassportId]);\n  const verificationDecision = selected ? verificationDecisions?.[selected.id] : undefined;\n  const verificationDetailsForSelected = selected ? verificationDetails?.[selected.id] : undefined;")
          once('src/components/PassportsView.tsx', "{selected.overallScore == null ? 'Not verified' : 'Measured'}", "{verificationDecisions?.[selected.id]?.state === 'VERIFIED' ? 'Verified' : verificationDecisions?.[selected.id]?.state === 'PARTIAL' ? 'Partially verified' : verificationDecisions?.[selected.id]?.state === 'INVESTIGATE' ? 'Investigate' : 'Not verified'}")
          p.write_text(s,encoding='utf-8')

          p=Path('src/components/MSPCommandCenter.tsx'); s=p.read_text(encoding='utf-8')
          once('src/components/MSPCommandCenter.tsx', "import { apiFetch } from '../utils/apiClient';", "import { apiFetch } from '../utils/apiClient';\nimport type { VerificationDecision } from '../lib/verification/evaluateVerification';")
          once('src/components/MSPCommandCenter.tsx', "  onNavigate: (tab: string) => void;\n}", "  onNavigate: (tab: string) => void;\n  verificationDecisions?: Record<string, VerificationDecision>;\n  verificationDetails?: Record<string, unknown>;\n}")
          once('src/components/MSPCommandCenter.tsx', "export default function MSPCommandCenter({ clients, alerts, findings, role = 'Viewer', onSelectClient, onNavigate }: Props) {", "export default function MSPCommandCenter({ clients, alerts, findings, role = 'Viewer', onSelectClient, onNavigate, verificationDecisions = {}, verificationDetails = {} }: Props) {")
          if 'verificationDecisions?.[item.passportId]' not in s:
              s=s.replace("  const canAssign = role === 'Owner' || role === 'Admin';", "  const canAssign = role === 'Owner' || role === 'Admin';\n  const trustStateFromDecision = (decision?: VerificationDecision) => decision?.state ?? 'UNINITIALIZED';\n  const trustStateForPassportItem = (item: { passportId: string }) => trustStateFromDecision(verificationDecisions?.[item.passportId]);\n  const passportDecision = (passport: { id: string }) => { const decision = verificationDecisions?.[passport.id]; return decision; };")
          p.write_text(s,encoding='utf-8')

          p=Path('src/routes/auth.ts'); s=p.read_text(encoding='utf-8')
          if "router.get('/user/passports/:id/verification'" not in s:
              s=s.replace("import { INTEGRATION_CATALOG } from '../integrations/catalog.ts';", "import { INTEGRATION_CATALOG } from '../integrations/catalog.ts';\nimport { adaptEvidenceForEvaluation } from '../lib/verification/evidenceAdapter.ts';\nimport { evaluateVerification, type VerificationDecision } from '../lib/verification/evaluateVerification.ts';")
              endpoint=r'''

  router.get('/user/passports/:id/verification', requireAuth, async (req: AuthenticatedRequest, res, next) => {
    try {
      const db = req.db!;
      const tenantId = req.user!.tenantId;
      const clientScope = req.user!.role === 'Client' ? (req.user as any).clientId : null;
      const passport = (await db.execute(sql`SELECT id, version, evidence, client_id AS "clientId" FROM passports WHERE id=${req.params.id} AND tenant_id=${tenantId} AND (${clientScope} IS NULL OR client_id=${clientScope}) LIMIT 1`) as any).rows?.[0];
      if (!passport) return res.status(404).json({ error: 'Passport not found' });
      const findingRows = (await db.execute(sql`SELECT id, passport_id AS "passportId", evidence_ids, status FROM trust_findings WHERE tenant_id=${tenantId} AND passport_id=${passport.id}`) as any).rows ?? [];
      const parseJson = (value: unknown, fallback: unknown[] = []) => { try { const parsed = JSON.parse(String(value ?? '')); return Array.isArray(parsed) ? parsed : fallback; } catch { return fallback; } };
      const openFindingEvidenceIds = findingRows.filter((row: any) => !['resolved','closed','verified'].includes(String(row.status || '').toLowerCase())).flatMap((row: any) => parseJson(row.evidence_ids)).filter((id: any): id is string => typeof id === 'string');
      const adapted = adaptEvidenceForEvaluation({ evidence: parseJson(passport.evidence) as any[], passportVersion: passport.version, openFindingEvidenceIds });
      const evaluatedAt = Date.now();
      const decision = evaluateVerification({ evidence: adapted.evidence, evaluatedAt, targetIdentity: adapted.targetIdentity });
      res.setHeader('Cache-Control', 'private, max-age=0, no-store');
      return res.json({ decision, observations: decision.observationCount, independentSources: decision.independentSourceCount });
    } catch (error) { return next(error); }
  });

  router.get('/user/verification', requireAuth, async (req: AuthenticatedRequest, res, next) => {
    try {
      const db = req.db!;
      const tenantId = req.user!.tenantId;
      const clientScope = req.user!.role === 'Client' ? (req.user as any).clientId : null;
      const passportRows = (await db.execute(sql`SELECT id, version, evidence, client_id AS "clientId" FROM passports WHERE tenant_id=${tenantId} AND (${clientScope} IS NULL OR client_id=${clientScope}) ORDER BY id`) as any).rows ?? [];
      const passportIds = passportRows.map((row: any) => String(row.id));
      const parseJson = (value: unknown, fallback: unknown[] = []) => { try { const parsed = JSON.parse(String(value ?? '')); return Array.isArray(parsed) ? parsed : fallback; } catch { return fallback; } };
      const findingRows = passportIds.length ? ((await db.execute(sql`SELECT id, passport_id AS "passportId", evidence_ids, status FROM trust_findings WHERE tenant_id=${tenantId} AND passport_id IN ${passportIds}`) as any).rows ?? []) : [];
      const evidenceByPassport = new Map<string, any[]>();
      for (const passport of passportRows) evidenceByPassport.set(String(passport.id), parseJson(passport.evidence) as any[]);
      const evaluatedAt = Date.now();
      const verificationDecisions: Record<string, VerificationDecision> = {};
      const verificationDetails: Record<string, unknown> = {};
      for (const passport of passportRows) {
        const findings = findingRows.filter((row: any) => String(row.passportId) === String(passport.id));
        const openFindingEvidenceIds = findings.filter((row: any) => !['resolved','closed','verified'].includes(String(row.status || '').toLowerCase())).flatMap((row: any) => parseJson(row.evidence_ids)).filter((id: any): id is string => typeof id === 'string');
        const adapted = adaptEvidenceForEvaluation({ evidence: evidenceByPassport.get(String(passport.id)) ?? [], passportVersion: passport.version, openFindingEvidenceIds });
        const decision = evaluateVerification({ evidence: adapted.evidence, evaluatedAt, targetIdentity: adapted.targetIdentity });
        verificationDecisions[String(passport.id)] = decision;
        verificationDetails[String(passport.id)] = { unmappedCount: adapted.unmappedCount, undatedCount: adapted.undatedCount, observations: decision.observationCount, independentSources: decision.independentSourceCount };
      }
      res.setHeader('Cache-Control', 'private, max-age=0, no-store');
      return res.json({ verificationDecisions, verificationDetails });
    } catch (error) { return next(error); }
  });
'''
              s=s.replace("  return router;", endpoint+"\n  return router;",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify typecheck and focused tests
        run: |
          npm ci
          npm run typecheck
          npx vitest run tests/verification-integration.test.ts tests/security/http-hardening.test.ts
          npm run build
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          git commit -m "repair: verification integration" || exit 0
          git push origin main
