name: Dependency Remediation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-remediation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Regenerate dependencies from npm audit remediation
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          # `npm audit fix` talks to the same audit endpoint that returned 503
          # and 400 for the better part of an hour on 2026-09-04 and failed this
          # job outright. Retry the remediation itself, then let the verify step
          # below decide whether the tree is actually clean.
          for attempt in 1 2 3 4 5; do
            if npm audit fix --force; then
              exit 0
            fi
            if [ "$attempt" = "5" ]; then
              echo "npm audit fix did not succeed in 5 attempts."
              exit 1
            fi
            echo "npm audit fix attempt ${attempt} failed; retrying in $((attempt * 15))s."
            sleep $((attempt * 15))
          done
      - name: Verify dependency remediation
        run: |
          node scripts/audit-with-retry.mjs --audit-level=high
          npm run typecheck
          npm test
          npm run build
      # `npm audit fix --force` is explicitly allowed to take major versions, so
      # this job can rewrite the dependency tree in ways no human asked for.
      # Pushing that straight to main meant a breaking upgrade could land
      # unreviewed; the verification above catches a tree that no longer builds
      # or passes, but not one that quietly changed behaviour. It opens a pull
      # request instead, so the change is still automatic and still fast, but a
      # person sees the diff before it is main.
      - name: Open a pull request with the dependency changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes were necessary.'
            exit 0
          fi
          BRANCH="dependency-remediation/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m 'security: remediate vulnerable dependencies'
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'security: remediate vulnerable dependencies' \
            --body 'Opened automatically by the Dependency Remediation workflow from `npm audit fix --force`.

`npm audit --audit-level=high`, `npm run typecheck`, `npm test` and `npm run build` all passed on this branch before the pull request was opened. Review the version changes before merging: `--force` is permitted to take major versions.'
