name: Dependency Remediation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dependency-remediation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Regenerate dependencies from npm audit remediation
        run: |
          npm install --no-audit --no-fund
          npm audit fix --force
      - name: Verify dependency remediation
        run: |
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run build
      - name: Commit dependency and lockfile changes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes were necessary.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'security: remediate vulnerable dependencies'
          git push origin main
