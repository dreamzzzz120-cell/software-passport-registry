name: GPT provider cleanup

on:
  push:
    branches:
      - chore/gpt-only-ai-provider

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy Gemini declarations and synchronize lockfile
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          delete pkg.dependencies?.['@google/genai'];
          pkg.devDependencies ??= {};
          pkg.devDependencies['@types/qrcode'] = '^1.5.6';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const configPath = 'src/config.ts';
          let config = fs.readFileSync(configPath, 'utf8');
          config = config.replace(
            "  GEMINI_API_KEY: optionalTrimmedString, GOOGLE_GENAI_API_KEY: optionalTrimmedString, AI_GATEWAY_API_KEY: optionalTrimmedString,",
            "  AI_GATEWAY_API_KEY: optionalTrimmedString,",
          );
          config = config.replace(
            "  gemini: { apiKey: parsedEnv.GEMINI_API_KEY ?? parsedEnv.GOOGLE_GENAI_API_KEY }, aiGateway: { apiKey: parsedEnv.AI_GATEWAY_API_KEY },",
            "  aiGateway: { apiKey: parsedEnv.AI_GATEWAY_API_KEY },",
          );
          config = config.replace(
            "  { name: 'GEMINI_API_KEY', category: 'featureSpecific', requiredInProduction: false }, { name: 'SENTRY_DSN', category: 'optional', requiredInProduction: false },",
            "  { name: 'SENTRY_DSN', category: 'optional', requiredInProduction: false },",
          );
          if (/GEMINI_API_KEY|GOOGLE_GENAI_API_KEY|gemini: \{/.test(config)) {
            throw new Error('Legacy Gemini declarations remain in src/config.ts');
          }
          fs.writeFileSync(configPath, config);
          NODE

          npm install --package-lock-only --ignore-scripts

          rm -f .github/workflows/gpt-cleanup.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/config.ts .github/workflows/gpt-cleanup.yml
          if git diff --cached --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git commit -m 'chore: complete GPT-only provider cleanup'
          git push origin HEAD:chore/gpt-only-ai-provider
