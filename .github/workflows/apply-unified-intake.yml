name: apply-unified-intake

on:
  push:
    branches: [feat/unified-review-intake-2]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[intake-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-review-intake-2
          fetch-depth: 0
      - name: Insert unified intake without replacing scanner UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/ScansView.tsx')
          s = p.read_text()
          imp = "import NewReviewIntake from './NewReviewIntake';\n"
          if "./NewReviewIntake" not in s:
              marker = "import { apiFetch } from '../utils/apiClient';\n"
              if marker not in s:
                  raise SystemExit('apiFetch import anchor not found')
              s = s.replace(marker, marker + imp, 1)
          anchor = '<div className="space-y-6" id="msp-scans-uploader">'
          block = '''\n      <NewReviewIntake />\n'''
          if '<NewReviewIntake />' not in s:
              if anchor not in s:
                  raise SystemExit('scanner page anchor not found')
              s = s.replace(anchor, anchor + block, 1)
          p.write_text(s)
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ScansView.tsx
          git diff --cached --quiet || git commit -m "Add unified intake to scans workspace [intake-patched]"
          git push origin HEAD:feat/unified-review-intake-2
