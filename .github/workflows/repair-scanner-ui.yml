name: repair-scanner-ui

on:
  push:
    branches:
      - fix/scanner-ui-evidence-backed

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[scanner-ui-repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair scanner UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/ScansView.tsx')
          s = p.read_text()

          changes = [
            ("  const [loadingSchedules, setLoadingSchedules] = useState(false);", "  const [loadingSchedules, setLoadingSchedules] = useState(false);\n  const [schedulesLoaded, setSchedulesLoaded] = useState(false);"),
            ("        setSchedules(data);", "        setSchedules(Array.isArray(data) ? data : []);\n        setSchedulesLoaded(true);"),
            ("  const [chosenClientName, setChosenClientName] = useState(() => (clients && clients.length > 0 ? clients[0].name : ''));", "  // Never silently select the first client; this can surface a seeded/demo record as the operator's target.\n  const [chosenClientName, setChosenClientName] = useState('');"),
            ("  // Set default passport ID\n  useEffect(() => {\n    if (passports && passports.length > 0 && !selectedPassportId) {\n      setSelectedPassportId(passports[0].id);\n    }\n  }, [passports, selectedPassportId]);", "  // A passport must be explicitly selected from the records returned by the API.\n  useEffect(() => {\n    if (selectedPassportId && !(passports || []).some((passport) => passport.id === selectedPassportId)) {\n      setSelectedPassportId('');\n    }\n  }, [passports, selectedPassportId]);"),
            ("  useEffect(() => {\n    if (clients && clients.length > 0 && !chosenClientName) {\n      setChosenClientName(clients[0].name);\n    }\n  }, [clients, chosenClientName]);", "  useEffect(() => {\n    if (chosenClientName && !(clients || []).some((client) => client.name === chosenClientName)) {\n      setChosenClientName('');\n    }\n  }, [clients, chosenClientName]);"),
            ("    ) || (passports && passports.find(p => p.id === selectedPassportId)) || (passports && passports[0]);", "    ) || (passports || []).find(p => p.id === selectedPassportId);"),
            ("Trigger the 8-engine AI Security pipeline and compile cryptographic evidence logs persistently in the database.", "Trigger the configured software security analysis pipeline and persist its resulting evidence logs."),
            ("                        {(passports || []).map(p => (", "                        <option value=\"\" disabled>Select a software passport</option>\n                        {(passports || []).map(p => ("),
            ("                        {clients && clients.length > 0 ? (\n                          clients.map(c => (\n                            <option key={c.id} value={c.name}>{c.name}</option>\n                          ))\n                        ) : (\n                          <option value=\"\" disabled>No clients configured yet</option>\n                        )}", "                        <option value=\"\" disabled>{clients && clients.length > 0 ? 'Select a client' : 'UNKNOWN — no client context observed'}</option>\n                        {(clients || []).map(c => (\n                          <option key={c.id} value={c.name}>{c.name}</option>\n                        ))}"),
            ("              {schedules.length}\n            </span>", "              {schedulesLoaded ? schedules.length : '—'}\n            </span>"),
            ("                      {schedules.filter(s => s.status === 'Active').length} / {schedules.length}", "                      {schedulesLoaded ? `${schedules.filter(s => s.status === 'Active').length} / ${schedules.length}` : 'UNKNOWN'}"),
            ("                        const uniqueProtected = new Set(schedules.filter(s => s.status === 'Active').map(s => s.assetHostName)).size;\n                        return `${uniqueProtected} / ${prodAssets.length}`;", "                        if (!schedulesLoaded) return 'UNKNOWN';\n                        if (prodAssets.length === 0) return '0 / 0';\n                        const uniqueProtected = new Set(schedules.filter(s => s.status === 'Active').map(s => s.assetHostName)).size;\n                        return `${uniqueProtected} / ${prodAssets.length}`;"),
            ("                        const uniqueProtected = new Set(schedules.filter(s => s.status === 'Active').map(s => s.assetHostName)).size;\n                        const pct = Math.round((uniqueProtected / prodAssets.length) * 100) || 0;\n                        return `${pct}%`;", "                        if (!schedulesLoaded) return 'UNKNOWN';\n                        if (prodAssets.length === 0) return '0%';\n                        const uniqueProtected = new Set(schedules.filter(s => s.status === 'Active').map(s => s.assetHostName)).size;\n                        const pct = Math.round((uniqueProtected / prodAssets.length) * 100);\n                        return `${pct}%`;"),
          ]

          for old, new in changes:
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old[:120]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Add regression coverage
        run: |
          cat > tests/scans-view-contract.test.ts <<'EOF'
          import { readFileSync } from 'node:fs';
          const source = readFileSync('src/components/ScansView.tsx', 'utf8');
          describe('ScansView evidence-backed UI contract', () => {
            it('requires explicit target selection', () => {
              expect(source).toContain("const [chosenClientName, setChosenClientName] = useState('');");
              expect(source).toContain("const [selectedPassportId, setSelectedPassportId] = useState('');");
              expect(source).toContain('Select a software passport');
              expect(source).toContain('Select a client');
              expect(source).not.toContain('clients[0].name');
              expect(source).not.toContain('passports[0].id');
            });
            it('does not claim a fixed eight-engine scanner count', () => {
              expect(source).not.toContain('8-engine AI Security pipeline');
              expect(source).toContain('configured software security analysis pipeline');
            });
            it('does not show an unconfirmed zero while schedules load', () => {
              expect(source).toContain("schedulesLoaded ? schedules.length : '—'");
              expect(source).toContain("!schedulesLoaded");
            });
          });
          EOF

      - name: Verify
        run: |
          ! grep -q "8-engine AI Security pipeline" src/components/ScansView.tsx
          ! grep -q "clients\[0\]\.name" src/components/ScansView.tsx
          ! grep -q "passports\[0\]\.id" src/components/ScansView.tsx
          grep -q "schedulesLoaded" src/components/ScansView.tsx
          git diff --check

      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/repair-scanner-ui.yml .scanner-ui-trigger .scanner-ui-trigger-2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ScansView.tsx tests/scans-view-contract.test.ts .github/workflows/repair-scanner-ui.yml .scanner-ui-trigger .scanner-ui-trigger-2
          git commit -m "fix: make scanner UI evidence-backed [scanner-ui-repair]"
          git push
