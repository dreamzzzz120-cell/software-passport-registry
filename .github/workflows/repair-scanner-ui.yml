name: repair-scanner-ui

on:
  push:
    branches:
      - fix/scanner-ui-evidence-backed

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[scanner-ui-repair]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair evidence-backed scanner UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/ScansView.tsx')
          s = p.read_text()

          def replace_once(pattern, replacement, label):
              global s
              s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {label} match; found {count}')
              s = s2

          replace_once(
              r"const \[schedules, setSchedules\] = useState<ScanSchedule\[\]>\(\[\]\);\n  const \[loadingSchedules, setLoadingSchedules\] = useState\(false\);",
              "const [schedules, setSchedules] = useState<ScanSchedule[]>([]);\n  const [loadingSchedules, setLoadingSchedules] = useState(false);\n  const [schedulesLoaded, setSchedulesLoaded] = useState(false);",
              'schedule loading state',
          )
          replace_once(
              r"        setSchedules\(data\);\n      \} else \{",
              "        setSchedules(Array.isArray(data) ? data : []);\n        setSchedulesLoaded(true);\n      } else {",
              'schedule response handling',
          )
          replace_once(
              r"  const \[customInputName, setCustomInputName\] = useState\(''\);\n  const \[chosenClientName, setChosenClientName\] = useState\(\(\) => \(clients && clients\.length > 0 \? clients\[0\]\.name : ''\)\);\n  const \[selectedPassportId, setSelectedPassportId\] = useState\(''\);\n\n  useEffect\(\(\) => \{\n    if \(clients && clients\.length > 0 && !chosenClientName\) \{\n      setChosenClientName\(clients\[0\]\.name\);\n    \}\n  \}, \[clients, chosenClientName\]\);\n\n  // Set default passport ID\n  useEffect\(\(\) => \{\n    if \(passports && passports\.length > 0 && !selectedPassportId\) \{\n      setSelectedPassportId\(passports\[0\]\.id\);\n    \}\n  \}, \[passports, selectedPassportId\]\);",
              "const [customInputName, setCustomInputName] = useState('');\n  // Never silently select the first client or passport. Production UI must not\n  // turn a seeded/demo record into an apparent operator choice.\n  const [chosenClientName, setChosenClientName] = useState('');\n  const [selectedPassportId, setSelectedPassportId] = useState('');\n\n  useEffect(() => {\n    if (chosenClientName && !(clients || []).some((client) => client.name === chosenClientName)) {\n      setChosenClientName('');\n    }\n  }, [clients, chosenClientName]);\n\n  useEffect(() => {\n    if (selectedPassportId && !(passports || []).some((passport) => passport.id === selectedPassportId)) {\n      setSelectedPassportId('');\n    }\n  }, [passports, selectedPassportId]);",
              'implicit target selection',
          )
          replace_once(
              r"    const matchedPassport = \(passports \|\| \[\]\)\.find\(p => \n      targetLower\.includes\(p\.name\.toLowerCase\(\)\) \|\| \n      p\.name\.toLowerCase\(\)\.includes\(targetLower\)\n    \) \|\| \(passports && passports\.find\(p => p\.id === selectedPassportId\)\) \|\| \(passports && passports\[0\]\);",
              "    const matchedPassport = (passports || []).find(p => \n      targetLower.includes(p.name.toLowerCase()) || \n      p.name.toLowerCase().includes(targetLower)\n    ) || (passports || []).find(p => p.id === selectedPassportId);",
              'passport fallback',
          )
          replace_once(
              r"Trigger the 8-engine AI Security pipeline and compile cryptographic evidence logs persistently in the database\.",
              "Trigger the configured software security analysis pipeline and persist its resulting evidence logs.",
              'fixed engine-count claim',
          )
          replace_once(
              r"(\s*)\{\(passports \|\| \[\]\)\.map\(p => \(\n\s*<option key=\{p\.id\} value=\{p\.id\}\}>\{p\.name\} \(v\{p\.version\}\) • \{p\.publisher\}</option>\n\s*\)\)\}",
              r"\1<option value=\"\" disabled>Select a software passport</option>\n\1{(passports || []).map(p => (\n\1  <option key={p.id} value={p.id}>{p.name} (v{p.version}) • {p.publisher}</option>\n\1))}",
              'passport selector placeholder',
          )
          replace_once(
              r"\{clients && clients\.length > 0 \? \(\n\s*clients\.map\(c => \(\n\s*<option key=\{c\.id\} value=\{c\.name\}>\{c\.name\}</option>\n\s*\)\)\n\s*\) : \(\n\s*<option value=\"\" disabled>No clients configured yet</option>\n\s*\)\}",
              "<option value=\"\" disabled>{clients && clients.length > 0 ? 'Select a client' : 'UNKNOWN — no client context observed'}</option>\n                        {(clients || []).map(c => (\n                          <option key={c.id} value={c.name}>{c.name}</option>\n                        ))}",
              'client selector placeholder',
          )
          replace_once(
              r"\{schedules\.length\}\n\s*</span>",
              "{schedulesLoaded ? schedules.length : '—'}\n            </span>",
              'schedule tab count',
          )
          replace_once(
              r"\{schedules\.filter\(s => s\.status === 'Active'\)\.length\} / \{schedules\.length\}",
              "{schedulesLoaded ? `${schedules.filter(s => s.status === 'Active').length} / ${schedules.length}` : 'UNKNOWN'}",
              'active schedule count',
          )
          replace_once(
              r"const uniqueProtected = new Set\(schedules\.filter\(s => s\.status === 'Active'\)\.map\(s => s\.assetHostName\)\)\.size;\n\s*return `\$\{uniqueProtected\} / \$\{prodAssets\.length\}`;",
              "if (!schedulesLoaded || prodAssets.length === 0) return schedulesLoaded ? '0 / 0' : 'UNKNOWN';\n                        const uniqueProtected = new Set(schedules.filter(s => s.status === 'Active').map(s => s.assetHostName)).size;\n                        return `${uniqueProtected} / ${prodAssets.length}`;",
              'asset coverage fallback',
          )
          replace_once(
              r"const uniqueProtected = new Set\(schedules\.filter\(s => s\.status === 'Active'\)\.map\(s => s\.assetHostName\)\)\.size;\n\s*const pct = Math\.round\(\(uniqueProtected / prodAssets\.length\) \* 100\) \|\| 0;\n\s*return `\$\{pct\}%`;",
              "if (!schedulesLoaded) return 'UNKNOWN';\n                        if (prodAssets.length === 0) return '0%';\n                        const uniqueProtected = new Set(schedules.filter(s => s.status === 'Active').map(s => s.assetHostName)).size;\n                        const pct = Math.round((uniqueProtected / prodAssets.length) * 100);\n                        return `${pct}%`;",
              'coverage ratio fallback',
          )

          p.write_text(s)
          PY

      - name: Add regression coverage
        run: |
          cat > tests/scans-view-contract.test.ts <<'EOF'
          import { readFileSync } from 'node:fs';

          const source = readFileSync('src/components/ScansView.tsx', 'utf8');

          describe('ScansView evidence-backed UI contract', () => {
            it('does not silently select the first client or passport', () => {
              expect(source).toContain("const [chosenClientName, setChosenClientName] = useState('');");
              expect(source).toContain("const [selectedPassportId, setSelectedPassportId] = useState('');");
              expect(source).toContain('Select a software passport');
              expect(source).toContain('Select a client');
              expect(source).not.toContain('clients[0].name');
              expect(source).not.toContain('passports[0].id');
            });

            it('does not claim a fixed eight-engine scanner count', () => {
              expect(source).not.toContain('8-engine AI Security pipeline');
              expect(source).toContain('configured software security analysis pipeline');
            });

            it('does not show an unconfirmed zero while schedules are loading', () => {
              expect(source).toContain("schedulesLoaded ? schedules.length : '—'");
              expect(source).toContain("!schedulesLoaded ? 'UNKNOWN'");
            });
          });
          EOF

      - name: Verify source changes
        run: |
          test "$(grep -c "8-engine AI Security pipeline" src/components/ScansView.tsx || true)" -eq 0
          test "$(grep -c "clients\[0\]\.name" src/components/ScansView.tsx || true)" -eq 0
          test "$(grep -c "passports\[0\]\.id" src/components/ScansView.tsx || true)" -eq 0
          grep -q "schedulesLoaded" src/components/ScansView.tsx

      - name: Commit repaired UI and remove one-time workflow
        run: |
          rm -f .github/workflows/repair-scanner-ui.yml .scanner-ui-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ScansView.tsx tests/scans-view-contract.test.ts .github/workflows/repair-scanner-ui.yml .scanner-ui-trigger
          git diff --cached --check
          git commit -m "fix: make scanner UI evidence-backed [scanner-ui-repair]"
          git push
