name: Production Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-safety:
    name: Migration Safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate migration numbering, ordering, and duplicates
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find . -type f -path '*/migrations/*.sql' -print | sort)
          declare -A seen
          expected=0
          for file in "${migrations[@]}"; do
            base="$(basename "$file")"
            if [[ ! "$base" =~ ^[0-9]{4}_[a-zA-Z0-9_-]+\.sql$ ]]; then
              echo "Invalid migration filename: $file"
              exit 1
            fi
            version="${base%%_*}"
            if [[ -n "${seen[$version]:-}" ]]; then
              echo "Duplicate migration version $version: ${seen[$version]} and $file"
              exit 1
            fi
            seen[$version]="$file"
            numeric=$((10#$version))
            if (( numeric != expected )); then
              echo "Migration sequence gap/out-of-order: expected $(printf '%04d' "$expected"), found $version"
              exit 1
            fi
            expected=$((expected + 1))
          done
          (( expected > 0 ))
      - name: Reject destructive migration statements
        shell: bash
        run: |
          set -euo pipefail
          matches=$(grep -RniE --include='*.sql' --exclude-dir=node_modules \
            -E '\bDROP[[:space:]]+(TABLE|SCHEMA|DATABASE)\b|\bTRUNCATE[[:space:]]+TABLE\b' . \
            | grep -vE ':[0-9]+:[[:space:]]*--' || true)
          if [[ -n "$matches" ]]; then
            printf '%s\n' "$matches"
            echo 'Destructive migration detected. Production release requires explicit review.'
            exit 1
          fi
      - name: Require authoritative integrity controls
        shell: bash
        run: |
          set -euo pipefail
          test -f migrations/0001_immutable_trust_observations.sql
          test -f migrations/0004_tenant_resource_integrity.sql
          test -f migrations/0007_webhook_delivery_hardening.sql
          test -f migrations/0009_authoritative_integrity_and_event_guards.sql
          test -f migrations/0010_foreign_key_integrity.sql
          grep -q 'pg_advisory_lock' scripts/migrate.ts
          grep -q 'ON CONFLICT (version) DO NOTHING' scripts/migrate.ts

  application-verification:
    name: Application Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Locked install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  database-verification:
    name: Database Integrity and Concurrency Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run migrations concurrently twice
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spr_test
          SQL_SSL: 'false'
        run: |
          set -euo pipefail
          node dist/migrate.cjs > /tmp/migrate-a.log 2>&1 & p1=$!
          node dist/migrate.cjs > /tmp/migrate-b.log 2>&1 & p2=$!
          wait "$p1"
          wait "$p2"
          cat /tmp/migrate-a.log
          cat /tmp/migrate-b.log
      - name: Verify schema, triggers, foreign keys and indexes
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spr_test
          SQL_SSL: 'false'
        run: npx tsx scripts/verify-db-hardening.ts
      - name: Prove migration idempotency with a third run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spr_test
          SQL_SSL: 'false'
        run: node dist/migrate.cjs

  release-gate:
    name: Release Gate
    needs: [migration-safety, application-verification, database-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless all gates passed
        run: |
          echo 'Migration safety, application verification, and live Postgres verification passed.'
          echo 'Deployment may proceed only through a protected environment requiring these checks.'
