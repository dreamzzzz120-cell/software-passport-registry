name: Finish hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch production hardening
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/integrations/adapters.ts')
          s = p.read_text()
          needle = "  const mapped = h.match(/^::ffff:(\\\\d+\\\\.\\\\d+\\\\.\\\\d+\\\\.\\\\d+)$/); if (mapped && net.isIP(mapped[1]) === 4) return blockPrivateAddress(mapped[1]);\n"
          # The source is one-line-heavy; locate the exact mapped-address statement
          # without depending on escaping in the workflow YAML.
          marker = "  const mapped = h.match(/^::ffff:("
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('mapped IPv4-mapped IPv6 check not found')
          end = s.find('\n', pos)
          if end < 0:
              raise SystemExit('could not locate mapped check line')
          line = s[pos:end]
          if 'mapped && net.isIP(mapped[1]) === 4' not in line:
              raise SystemExit('unexpected mapped check')
          insertion = "  const mappedHexPrefix = ipv6ToBigInt('::ffff:0:0');\n  const mappedHexValue = ipv6ToBigInt(h);\n  if (mappedHexPrefix !== undefined && mappedHexValue !== undefined && (mappedHexValue >> 32n) === (mappedHexPrefix >> 32n)) {\n    const v4 = Number(mappedHexValue & 0xffffffffn);\n    const dotted = `${v4 >>> 24}.${(v4 >>> 16) & 255}.${(v4 >>> 8) & 255}.${v4 & 255}`;\n    return blockPrivateAddress(dotted);\n  }\n"
          if 'mappedHexPrefix' not in s:
              s = s[:end+1] + insertion + s[end+1:]
              p.write_text(s)

          p = Path('src/routes/billing.ts')
          s = p.read_text()
          old = """    const inserted = await db.execute(sql`INSERT INTO billing_webhook_events (id, event_type) VALUES (${event.id}, ${event.type}) ON CONFLICT (id) DO NOTHING RETURNING id`);\n    if (!(inserted as any).rows?.length) return res.status(200).json({ received: true, duplicate: true });\n"""
          new = """    const inserted = await db.execute(sql`\n      INSERT INTO billing_webhook_events (id, event_type, processing_attempts, last_error)\n      VALUES (${event.id}, ${event.type}, 1, NULL)\n      ON CONFLICT (id) DO UPDATE SET\n        processing_attempts = billing_webhook_events.processing_attempts + 1\n      WHERE billing_webhook_events.processed_at IS NULL\n      RETURNING id, processed_at\n    `);\n    const webhookRow = (inserted as any).rows?.[0];\n    if (!webhookRow) return res.status(200).json({ received: true, duplicate: true });\n"""
          if old in s:
              s = s.replace(old, new, 1)
          elif 'processing_attempts = billing_webhook_events.processing_attempts + 1' not in s:
              raise SystemExit('webhook idempotency block not found')

          old = """    return res.status(200).json({ received: true });\n  } catch (error) {\n    console.error('[Billing] Webhook event handling failed:', error instanceof Error ? error.message : String(error));\n    return res.status(500).json({ error: 'WEBHOOK_PROCESSING_FAILED' });\n  }\n}"""
          new = """    await db.execute(sql`\n      UPDATE billing_webhook_events\n      SET processed_at = CURRENT_TIMESTAMP, last_error = NULL\n      WHERE id = ${event.id} AND processed_at IS NULL\n    `);\n    return res.status(200).json({ received: true });\n  } catch (error) {\n    const message = error instanceof Error ? error.message : String(error);\n    console.error('[Billing] Webhook event handling failed:', message);\n    await db.execute(sql`\n      UPDATE billing_webhook_events\n      SET last_error = ${message.slice(0, 1000)}\n      WHERE id = ${event.id} AND processed_at IS NULL\n    `).catch(() => undefined);\n    return res.status(500).json({ error: 'WEBHOOK_PROCESSING_FAILED' });\n  }\n}"""
          if old in s:
              s = s.replace(old, new, 1)
          elif 'SET processed_at = CURRENT_TIMESTAMP, last_error = NULL' not in s:
              raise SystemExit('webhook success/catch block not found')
          p.write_text(s)
      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/billing.ts src/integrations/adapters.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: make webhook retries durable and close mapped IPv6 SSRF edge"
          git push