name: Security Route Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'server.ts'
      - 'tests/**'
      - 'migrations/**'
      - '.github/workflows/security-route-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spr_test
          POSTGRES_PASSWORD: spr_test_only
          POSTGRES_DB: spr_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spr_test -d spr_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      SPR_SKIP_AUTOSTART: 'true'
      SPR_SECURITY_TEST_AUTH: 'true'
      SPR_TEST_DATABASE_URL: postgresql://spr_test:spr_test_only@127.0.0.1:5432/spr_security_test
      DATABASE_URL: postgresql://spr_test:spr_test_only@127.0.0.1:5432/spr_security_test
      SPR_TEST_FIREBASE_PROJECT_ID: demo-spr-security
      FIREBASE_PROJECT_ID: demo-spr-security
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run available static security contracts
        run: >
          npx vitest run src/security
          tests/auth-rbac-contract.test.ts
          tests/compliance-schedules-contract.test.ts
          tests/msp-ai-trust-contract.test.ts
          tests/security-contract.test.ts
          tests/ux-audit-fixes-contract.test.ts
      - name: Require live route-security fixtures
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d tests/security ]]; then
            echo 'Required live route-security fixture directory is missing: tests/security'
            exit 1
          fi
          if [[ ! -f tests/security/seed-authz-fixtures.sql ]]; then
            echo 'Required live route-security fixture is missing: tests/security/seed-authz-fixtures.sql'
            exit 1
          fi
          shopt -s nullglob
          live_tests=(tests/security/*.test.ts)
          if (( ${#live_tests[@]} == 0 )); then
            echo 'Required live route-security tests are missing: tests/security/*.test.ts'
            exit 1
          fi
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest
      - name: Start Firebase Auth emulator
        run: firebase emulators:start --only auth --project demo-spr-security > /tmp/firebase-emulator.log 2>&1 &
      - name: Wait for Auth emulator
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/firebase-emulator.log
          exit 1
      - name: Create isolated emulator identities and export ID tokens
        shell: bash
        run: |
          set -euo pipefail
          # The emulator's public signUp endpoint refuses a caller-supplied
          # localId with a bare 400, which is what killed this job on every pull
          # request it has ever run on. Let the emulator assign the uid and carry
          # it forward instead: it is exported here and substituted into the seed
          # SQL, so users.uid still matches the sub claim in the ID token.
          create_user() {
            local email="$1" out="$2" verify="$3" code
            code=$(curl --silent --show-error -o "$out" -w '%{http_code}' -X POST -H 'content-type: application/json' -d "{\"email\":\"${email}\",\"password\":\"SecurityTest-Only-123!\",\"returnSecureToken\":true}" "http://127.0.0.1:9099/identitytoolkit.googleapis.com/v1/accounts:signUp?key=demo-spr-security")
            if [ "$code" != '200' ]; then
              echo "signUp for ${email} failed with HTTP ${code}:" >&2
              cat "$out" >&2
              return 1
            fi
            if [ "$verify" = 'true' ]; then
              local token
              token=$(node -p "require('$out').idToken")
              code=$(curl --silent --show-error -o /tmp/verify.json -w '%{http_code}' -X POST -H 'content-type: application/json' -d "{\"idToken\":\"${token}\",\"emailVerified\":true}" "http://127.0.0.1:9099/identitytoolkit.googleapis.com/v1/accounts:update?key=demo-spr-security")
              if [ "$code" != '200' ]; then
                echo "emailVerified update for ${email} failed with HTTP ${code}:" >&2
                cat /tmp/verify.json >&2
                return 1
              fi
              code=$(curl --silent --show-error -o "$out" -w '%{http_code}' -X POST -H 'content-type: application/json' -d "{\"email\":\"${email}\",\"password\":\"SecurityTest-Only-123!\",\"returnSecureToken\":true}" "http://127.0.0.1:9099/identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=demo-spr-security")
              if [ "$code" != '200' ]; then
                echo "signIn for ${email} failed with HTTP ${code}:" >&2
                cat "$out" >&2
                return 1
              fi
            fi
          }
          create_user tenant-a@security.test /tmp/a.json true
          create_user tenant-b@security.test /tmp/b.json true
          create_user unverified@security.test /tmp/u.json false
          {
            echo "SPR_TEST_TENANT_A_UID=$(node -p "require('/tmp/a.json').localId")"
            echo "SPR_TEST_TENANT_B_UID=$(node -p "require('/tmp/b.json').localId")"
            echo "SPR_TEST_TENANT_A_ID_TOKEN=$(node -p "require('/tmp/a.json').idToken")"
            echo "SPR_TEST_TENANT_B_ID_TOKEN=$(node -p "require('/tmp/b.json').idToken")"
            echo "SPR_TEST_UNVERIFIED_ID_TOKEN=$(node -p "require('/tmp/u.json').idToken")"
          } >> "$GITHUB_ENV"
      - name: Apply database migrations
        run: |
          for migration in migrations/*.sql; do
            PGPASSWORD=spr_test_only psql "$SPR_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Seed isolated Tenant A/B resources
        run: |
          PGPASSWORD=spr_test_only psql "$SPR_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -v tenant_a_uid="$SPR_TEST_TENANT_A_UID" -v tenant_b_uid="$SPR_TEST_TENANT_B_UID" -f tests/security/seed-authz-fixtures.sql
          echo 'SPR_TEST_TENANT_A_RESOURCE_ID=security-passport-a' >> "$GITHUB_ENV"
          echo 'SPR_TEST_TENANT_B_RESOURCE_ID=security-passport-b' >> "$GITHUB_ENV"
      - name: Run route security tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          live_tests=(tests/security/*.test.ts)
          npx vitest run "${live_tests[@]}"
