name: Security Route Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'server.ts'
      - 'tests/security/**'
      - 'migrations/**'
      - '.github/workflows/security-route-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spr_test
          POSTGRES_PASSWORD: spr_test_only
          POSTGRES_DB: spr_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spr_test -d spr_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      SPR_SKIP_AUTOSTART: 'true'
      SPR_SECURITY_TEST_AUTH: 'true'
      SPR_TEST_DATABASE_URL: postgresql://spr_test:spr_test_only@127.0.0.1:5432/spr_security_test
      DATABASE_URL: postgresql://spr_test:spr_test_only@127.0.0.1:5432/spr_security_test
      SPR_TEST_FIREBASE_PROJECT_ID: demo-spr-security
      FIREBASE_PROJECT_ID: demo-spr-security
      SPR_TEST_TENANT_A_UID: tenant-a-test-user
      SPR_TEST_TENANT_B_UID: tenant-b-test-user
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@latest
      - name: Start Firebase Auth emulator
        run: firebase emulators:start --only auth --project demo-spr-security > /tmp/firebase-emulator.log 2>&1 &
      - name: Wait for Auth emulator
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/firebase-emulator.log
          exit 1
      - name: Create isolated emulator identities and export ID tokens
        shell: bash
        run: |
          set -euo pipefail
          create_user() {
            local uid="$1" email="$2" out="$3" verify="$4"
            curl --fail --silent --show-error -X POST -H 'content-type: application/json' \
              -d "{\"localId\":\"${uid}\",\"email\":\"${email}\",\"password\":\"SecurityTest-Only-123!\",\"returnSecureToken\":true}" \
              "http://127.0.0.1:9099/identitytoolkit.googleapis.com/v1/accounts:signUp?key=demo-spr-security" > "$out"
            if [ "$verify" = 'true' ]; then
              local token
              token=$(node -p "require('$out').idToken")
              curl --fail --silent --show-error -X POST -H 'content-type: application/json' \
                -d "{\"idToken\":\"${token}\",\"emailVerified\":true}" \
                "http://127.0.0.1:9099/identitytoolkit.googleapis.com/v1/accounts:update?key=demo-spr-security" >/dev/null
              curl --fail --silent --show-error -X POST -H 'content-type: application/json' \
                -d "{\"email\":\"${email}\",\"password\":\"SecurityTest-Only-123!\",\"returnSecureToken\":true}" \
                "http://127.0.0.1:9099/identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=demo-spr-security" > "$out"
            fi
          }
          create_user tenant-a-test-user tenant-a@security.test /tmp/a.json true
          create_user tenant-b-test-user tenant-b@security.test /tmp/b.json true
          create_user unverified-test-user unverified@security.test /tmp/u.json false
          echo "SPR_TEST_TENANT_A_ID_TOKEN=$(node -p \"require('/tmp/a.json').idToken\")" >> "$GITHUB_ENV"
          echo "SPR_TEST_TENANT_B_ID_TOKEN=$(node -p \"require('/tmp/b.json').idToken\")" >> "$GITHUB_ENV"
          echo "SPR_TEST_UNVERIFIED_ID_TOKEN=$(node -p \"require('/tmp/u.json').idToken\")" >> "$GITHUB_ENV"
      - name: Apply database migrations
        run: |
          for migration in migrations/*.sql; do
            PGPASSWORD=spr_test_only psql "$SPR_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Seed isolated Tenant A/B resources
        run: |
          PGPASSWORD=spr_test_only psql "$SPR_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/security/seed-authz-fixtures.sql
          echo 'SPR_TEST_TENANT_A_RESOURCE_ID=security-passport-a' >> "$GITHUB_ENV"
          echo 'SPR_TEST_TENANT_B_RESOURCE_ID=security-passport-b' >> "$GITHUB_ENV"
      - name: Run route security tests
        run: npx vitest run tests/security/route-authz.test.ts tests/security/fixture-contract.test.ts tests/security/http-hardening.test.ts
