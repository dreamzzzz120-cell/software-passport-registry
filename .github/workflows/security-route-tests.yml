name: Security Route Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'server.ts'
      - 'tests/**'
      - 'migrations/**'
      - '.github/workflows/security-route-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spr_test
          POSTGRES_PASSWORD: spr_test_only
          POSTGRES_DB: spr_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spr_test -d spr_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      SPR_SKIP_AUTOSTART: 'true'
      SPR_SECURITY_TEST_AUTH: 'true'
      SPR_TEST_DATABASE_URL: postgresql://spr_test:spr_test_only@127.0.0.1:5432/spr_security_test
      DATABASE_URL: postgresql://spr_test:spr_test_only@127.0.0.1:5432/spr_security_test
      # tests/security/rls-tenant-isolation.test.ts only runs its live
      # cross-tenant attack assertions when APP_DATABASE_URL is set, and it
      # must point at the least-privileged spr_app_runtime role -- the same
      # role production connects as -- not the migration-owning superuser,
      # or the test would be proving nothing. The role exists after
      # migrations run but has no password until the step below sets one.
      APP_DATABASE_URL: postgresql://spr_app_runtime:spr_rls_test_only@127.0.0.1:5432/spr_security_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run available static security contracts
        run: >
          npx vitest run src/security
          tests/auth-rbac-contract.test.ts
          tests/compliance-schedules-contract.test.ts
          tests/msp-ai-trust-contract.test.ts
          tests/security-contract.test.ts
          tests/ux-audit-fixes-contract.test.ts
      - name: Require live route-security fixtures
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d tests/security ]]; then
            echo 'Required live route-security fixture directory is missing: tests/security'
            exit 1
          fi
          if [[ ! -f tests/security/seed-authz-fixtures.sql ]]; then
            echo 'Required live route-security fixture is missing: tests/security/seed-authz-fixtures.sql'
            exit 1
          fi
          shopt -s nullglob
          live_tests=(tests/security/*.test.ts)
          if (( ${#live_tests[@]} == 0 )); then
            echo 'Required live route-security tests are missing: tests/security/*.test.ts'
            exit 1
          fi
      - name: Create isolated test identities and export ID tokens
        shell: bash
        run: |
          set -euo pipefail
          # The server's Supabase adapter has an explicit test-only JWT claims
          # path gated by SPR_SECURITY_TEST_AUTH=true. These tokens never leave
          # this isolated CI job and cannot authenticate outside NODE_ENV=test.
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
          const token = (claims) => `${encode({ alg: 'none', typ: 'JWT' })}.${encode(claims)}.`;
          const uidA = '00000000-0000-4000-8000-00000000000a';
          const uidB = '00000000-0000-4000-8000-00000000000b';
          const uidU = '00000000-0000-4000-8000-00000000000c';
          const lines = [
            `SPR_TEST_TENANT_A_UID=${uidA}`,
            `SPR_TEST_TENANT_B_UID=${uidB}`,
            `SPR_TEST_TENANT_A_ID_TOKEN=${token({ sub: uidA, email: 'tenant-a@security.test', email_verified: true })}`,
            `SPR_TEST_TENANT_B_ID_TOKEN=${token({ sub: uidB, email: 'tenant-b@security.test', email_verified: true })}`,
            `SPR_TEST_UNVERIFIED_ID_TOKEN=${token({ sub: uidU, email: 'unverified@security.test', email_verified: false })}`,
          ];
          appendFileSync(process.env.GITHUB_ENV, lines.join('\n') + '\n');
          NODE
      - name: Apply database migrations
        run: |
          for migration in migrations/*.sql; do
            PGPASSWORD=spr_test_only psql "$SPR_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Configure spr_app_runtime for the RLS test
        # migrations/0020_row_level_security.sql creates spr_app_runtime as a
        # passwordless LOGIN role. Give it the password APP_DATABASE_URL above
        # expects, so the live tenant-isolation test connects as the same
        # restricted, non-bypassrls role production uses.
        run: |
          PGPASSWORD=spr_test_only psql "$SPR_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE spr_app_runtime WITH LOGIN PASSWORD 'spr_rls_test_only';" # gitleaks:allow
      - name: Seed isolated Tenant A/B resources
        run: |
          PGPASSWORD=spr_test_only psql "$SPR_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -v tenant_a_uid="$SPR_TEST_TENANT_A_UID" -v tenant_b_uid="$SPR_TEST_TENANT_B_UID" -f tests/security/seed-authz-fixtures.sql
          echo 'SPR_TEST_TENANT_A_RESOURCE_ID=security-passport-a' >> "$GITHUB_ENV"
          echo 'SPR_TEST_TENANT_B_RESOURCE_ID=security-passport-b' >> "$GITHUB_ENV"
      - name: Run route security tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Every suite that needs a real Postgres (DATABASE_URL) lives here;
          # under plain "npm test" those describe blocks are skipped, so this
          # is the only place they actually execute.
          live_tests=(tests/security/*.test.ts tests/remediation-tasks-contract.test.ts)
          npx vitest run "${live_tests[@]}"
