name: SPR production load verification

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target base URL (use staging by default; production only during an approved window)'
        required: true
        type: string
      duration:
        description: 'Test duration'
        required: false
        default: '60s'
        type: string
      public_rate:
        description: 'Public requests per second'
        required: false
        default: '5'
        type: string
      auth_rate:
        description: 'Authenticated requests per second'
        required: false
        default: '2'
        type: string

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run bounded k6 verification
        env:
          BASE_URL: ${{ inputs.base_url }}
          DURATION: ${{ inputs.duration }}
          PUBLIC_RATE: ${{ inputs.public_rate }}
          AUTH_RATE: ${{ inputs.auth_rate }}
          SPR_ID_TOKEN: ${{ secrets.SPR_LOAD_TEST_ID_TOKEN }}
        run: |
          docker run --rm \
            -e BASE_URL \
            -e DURATION \
            -e PUBLIC_RATE \
            -e AUTH_RATE \
            -e SPR_ID_TOKEN \
            -v "$PWD:/work:ro" \
            grafana/k6:0.52.0 run /work/load/production-smoke.js
