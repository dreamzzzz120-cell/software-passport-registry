name: Security Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  # gitleaks-action's ScanPullRequest path calls the REST API to enumerate the
  # PR's commits. Without pull-requests: read that call returns "Resource not
  # accessible by integration" and the action throws before scanning anything --
  # so the secret gate was failing loudly without ever inspecting a commit.
  pull-requests: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security / dependency / test gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # gitleaks scans <commit>^..<commit> on pull_request events, so the
          # parent commit has to be in the clone. With fetch-depth: 1 it is not,
          # and the action fails with "unknown revision" before scanning a byte.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify lockfile is clean
        run: git diff --exit-code -- package-lock.json npm-shrinkwrap.json yarn.lock pnpm-lock.yaml

      # Runs `npm audit --audit-level=high` and fails on any advisory at or
      # above high. The wrapper exists because npm returns exit code 1 both for
      # a real finding and for its own audit endpoint being unreachable, and a
      # registry outage failed this gate on three consecutive commits. Only the
      # unreachable case is retried; a finding fails on the first attempt, and
      # an audit that never completed still fails.
      - name: Dependency audit
        run: node scripts/audit-with-retry.mjs --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Security test suite
        run: npx vitest run src/security
