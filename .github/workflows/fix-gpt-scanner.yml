name: Fix GPT Scanner
on:
  push:
    branches: [chore/gpt-only-ai-provider]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: chore/gpt-only-ai-provider
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Apply GPT scanner migration
        run: node scripts/fix-gpt-scanner.mjs
      - name: Verify no Gemini references remain in scanner
        run: '! grep -nEi "google/genai|GoogleGenAI|gemini" src/utils/scanner.ts'
      - name: Commit migration and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-gpt-scanner.yml scripts/fix-gpt-scanner.mjs
          git add src/utils/scanner.ts
          git commit -m 'fix: route scanner AI reasoning through GPT gateway'
          git push origin chore/gpt-only-ai-provider
