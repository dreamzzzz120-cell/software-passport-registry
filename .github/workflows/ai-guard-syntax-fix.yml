name: AI Guard Syntax Fix

on:
  push:
    paths:
      - '.github/workflows/ai-guard-syntax-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[ai-guard-syntax-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair scanner block and validate
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/utils/scanner.ts')
          s = p.read_text()
          marker = "\n    // Write final summary and calculated scores back to database"
          if marker not in s:
              raise SystemExit('scanner marker not found')
          before = s.split(marker, 1)[0]
          if not before.rstrip().endswith('}'):
              s = before + "\n    }" + marker + s.split(marker, 1)[1]
              p.write_text(s)
          else:
              raise SystemExit('scanner already has closing brace; refusing unrelated edit')
      - name: Commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/scanner.ts .github/workflows/ai-guard-syntax-fix.yml
          git commit -m 'fix: close scanner AI fallback block [ai-guard-syntax-fix]'
          git rm .github/workflows/ai-guard-syntax-fix.yml
          git commit -m 'chore: remove temporary syntax fix workflow [ai-guard-syntax-fix]'
          git push
