name: Traffic Route Smoke
on:
  pull_request:
    paths:
      - '.github/workflows/traffic-route-smoke.yml'
      - 'vercel.json'
      - 'src/routes/traffic.ts'
      - 'src/analytics.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-route:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify live traffic route without recording an event
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.softwarepassportregistry.com/api/traffic/event"
          # Invalid body should be rejected with 400 before touching PostgreSQL.
          # Never send a valid synthetic event: this is a non-writing smoke probe.
          status=$(curl --silent --show-error --location --max-time 20 \
            --output /tmp/traffic-response --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"sessionId":"bad","path":"/","eventName":"page_view"}' \
            "$url")
          echo "Traffic route returned HTTP $status"
          if [[ "$status" != "400" ]]; then
            echo "::error::Expected HTTP 400 from event validation; routing or backend may be broken (HTTP $status)."
            exit 1
          fi
          grep -q 'INVALID_EVENT' /tmp/traffic-response || {
            echo "::error::HTTP 400 was not generated by SPR's event validation handler."
            exit 1
          }
          echo "Validated: live route reaches SPR handler; no telemetry row was inserted."
