# SPDX-License-Identifier: LicenseRef-SPR-Proprietary\nname: SPR LOM Continuous Security Monitor\non:\n  push:\n    branches: [main]\n  pull_request:\n  schedule:\n    - cron: "7/7 * * * *"\n  workflow_dispatch:\npermissions:\n  contents: read\nconcurrency:\n  group: lom-${{ github.ref }}\n  cancel-in-progress: true\njobs:\n  lom:\n    name: LOM source dependency runtime scan\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    steps:\n      - name: Checkout\n        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5\n      - name: Setup Node\n        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5\n        with:\n          node-version: 22\n          cache: npm\n      - name: Install locked dependencies\n        run: npm ci --ignore-scripts --no-audit --no-fund\n      - name: Run LOM\n        env:\n          LOM_RUNTIME_URL: ${{ vars.LOM_RUNTIME_URL }}\n        run: npm run lom:scan -- --report artifacts/lom-report.json\n      - name: Upload LOM report\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: lom-report-${{ github.run_id }}\n          path: artifacts/lom-report.json\n          if-no-files-found: warn\n          retention-days: 14\n