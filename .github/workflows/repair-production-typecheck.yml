name: One-time production typecheck repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'repair: production typecheck')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply production typecheck fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:160]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace(
              'src/components/ExtensionWorkflow.tsx',
              "{metrics.map(([label, value]) => <Metric key={label} label={label} value={value} loading={loading} />)}",
              "{metrics.map((metric) => { const [label, value] = metric; return <Metric key={label} label={label} value={value} loading={loading} />; })}"
          )

          replace(
              'src/components/PassportsView.tsx',
              "{selected.scoreStatus || 'Not verified'}",
              "{selected.verificationStatus === 'verified' ? 'Verified' : selected.verificationStatus === 'partial' ? 'Partially verified' : 'Not verified'}"
          )

          replace(
              'src/components/SoftwareSectorsPanel.tsx',
              "const avgTrust = count > 0\n        ? Math.round(matched.reduce((acc, p) => acc + p.overallScore, 0) / count)\n        : 0;",
              "const measuredScores = matched.map((p) => p.overallScore).filter((score): score is number => score != null);\n      const avgTrust = measuredScores.length > 0\n        ? Math.round(measuredScores.reduce((acc, score) => acc + score, 0) / measuredScores.length)\n        : 0;"
          )

          replace(
              'src/components/SoftwareSectorsPanel.tsx',
              "const overallEcosystemTrust = passports.length > 0\n      ? Math.round(passports.reduce((acc, p) => acc + p.overallScore, 0) / passports.length)\n      : 90;",
              "const measuredScores = passports.map((p) => p.overallScore).filter((score): score is number => score != null);\n    const overallEcosystemTrust = measuredScores.length > 0\n      ? Math.round(measuredScores.reduce((acc, score) => acc + score, 0) / measuredScores.length)\n      : 0;"
          )

          p = Path('server.ts')
          s = p.read_text(encoding='utf-8')
          if 'export function rejectConnectTunnels' not in s:
              anchor = "export function normalizeAllowedOrigins(origins: string[]): string[] {\n"
              helper = "export function rejectConnectTunnels<T extends ReturnType<typeof app.listen>>(server: T): T {\n  server.on('connect', (_req, socket) => {\n    socket.end('HTTP/1.1 405 Method Not Allowed\\r\\nConnection: close\\r\\nContent-Length: 0\\r\\n\\r\\n');\n  });\n  return server;\n}\n\n"
              if anchor not in s:
                  raise SystemExit('server.ts anchor not found')
              s = s.replace(anchor, helper + anchor, 1)
          if 'export { app };' not in s:
              s += '\nexport { app };\n'
          p.write_text(s, encoding='utf-8')

          replace('tests/security/http-hardening.test.ts', 'const address = server.address();', 'const address = server!.address();')

          p = Path('src/routes/trust-loop.ts')
          s = p.read_text(encoding='utf-8')
          if 'export type ReportPassportRow' not in s:
              s += '''\n\nexport type ReportPassportRow = {\n  overall_score: number | null;\n  security_score: number | null;\n  compliance_score: number | null;\n  verification_status: 'unverified' | 'partial' | 'verified' | null;\n  confidence_score: number | null;\n  evidence_completeness: number | null;\n};\n\nexport function deriveReportRiskFields(passport: ReportPassportRow) {\n  return {\n    canonicalScore: passport.overall_score,\n    verificationStatus: passport.verification_status ?? 'unverified',\n    confidenceBasisPoints: passport.confidence_score == null ? null : Math.round(passport.confidence_score * 100),\n    completenessBasisPoints: passport.evidence_completeness == null ? null : Math.round(passport.evidence_completeness * 100),\n  };\n}\n'''
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: npm ci && npm run typecheck && npm test && npm run build

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src server.ts tests
          git diff --cached --check
          git commit -m "repair: production typecheck" || exit 0
          git push origin main
