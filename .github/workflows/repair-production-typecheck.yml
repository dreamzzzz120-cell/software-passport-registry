name: Repair verification integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'repair: verification integration')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply idempotent repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=False):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old,new,1),encoding='utf-8')
              elif required:
                  raise SystemExit(f'anchor missing: {path}: {old[:120]!r}')

          # The old one-time workflow is no longer needed after this repair.
          replace('.github/workflows/repair-production-typecheck.yml', "if: \"!contains(github.event.head_commit.message, 'repair: production typecheck')\"", 'if: false')

          # App: one authoritative batch request; retrieval failure fails closed.
          replace('src/App.tsx', "import type { Alert, Client, Integration, Scan, SoftwarePassport, Vendor } from './types';", "import type { Alert, Client, Integration, Scan, SoftwarePassport, Vendor } from './types';\nimport type { VerificationDecision } from './lib/verification/evaluateVerification.ts';")
          replace('src/App.tsx', "const [theme, setTheme] = useState<'light' | 'dark'>('dark');", "const [theme, setTheme] = useState<'light' | 'dark'>('dark');\n  const [verificationDecisions, setVerificationDecisions] = useState<Record<string, VerificationDecision>>({});\n  const [verificationDetails, setVerificationDetails] = useState<Record<string, unknown>>({});")
          replace('src/App.tsx', "apiFetch('/api/user/me'), apiFetch('/api/scans'), apiFetch('/api/trust-loop/findings'), apiFetch('/api/user/passports'), apiFetch('/api/user/clients'), apiFetch('/api/integrations'),", "apiFetch('/api/user/me'), apiFetch('/api/scans'), apiFetch('/api/trust-loop/findings'), apiFetch('/api/user/passports'), apiFetch('/api/user/clients'), apiFetch('/api/integrations'), apiFetch('/api/user/verification'),")
          replace('src/App.tsx', "const [me, scansResponse, findingsResponse, passportsResponse, clientsResponse, integrationsResponse] = responses;", "const [me, scansResponse, findingsResponse, passportsResponse, clientsResponse, integrationsResponse, verificationResponse] = responses;\n      if (verificationResponse.ok) { const data = await verificationResponse.json().catch(() => null); if (!cancelled) { setVerificationDecisions(data?.verificationDecisions && typeof data.verificationDecisions === 'object' ? data.verificationDecisions : {}); setVerificationDetails(data?.verificationDetails && typeof data.verificationDetails === 'object' ? data.verificationDetails : {}); } } else if (!cancelled) { setVerificationDecisions({}); setVerificationDetails({}); }")
          replace('src/App.tsx', "<PassportsView passports={passports}", "<PassportsView verificationDecisions={verificationDecisions} verificationDetails={verificationDetails} passports={passports}")
          replace('src/App.tsx', "<MSPCommandCenter clients={clients}", "<MSPCommandCenter verificationDecisions={verificationDecisions} verificationDetails={verificationDetails} clients={clients}")

          # Passport surface consumes only the authoritative decision map.
          replace('src/components/PassportsView.tsx', "import type { Client, SoftwarePassport } from '../types';", "import type { Client, SoftwarePassport } from '../types';\nimport type { VerificationDecision } from '../lib/verification/evaluateVerification';")
          replace('src/components/PassportsView.tsx', "  role?: string;\n}", "  role?: string;\n  verificationDecisions?: Record<string, VerificationDecision>;\n  verificationDetails?: Record<string, unknown>;\n}")
          replace('src/components/PassportsView.tsx', "export default function PassportsView({ passports, selectedPassportId, setSelectedPassportId, searchQuery, onNavigateTab, clients = [], assets = [], role = 'Viewer' }: PassportsViewProps) {", "export default function PassportsView({ passports, selectedPassportId, setSelectedPassportId, searchQuery, onNavigateTab, clients = [], assets = [], role = 'Viewer', verificationDecisions = {}, verificationDetails = {} }: PassportsViewProps) {")
          replace('src/components/PassportsView.tsx', "  const selected = useMemo(() => passports.find((p) => p.id === selectedPassportId) ?? null, [passports, selectedPassportId]);", "  const selected = useMemo(() => passports.find((p) => p.id === selectedPassportId) ?? null, [passports, selectedPassportId]);\n  const verificationDecision = selected ? verificationDecisions?.[selected.id] : undefined;\n  const verificationDetailsForSelected = selected ? verificationDetails?.[selected.id] : undefined;")
          replace('src/components/PassportsView.tsx', "{selected.overallScore == null ? 'Not verified' : 'Measured'}", "{verificationDecisions?.[selected.id]?.state === 'VERIFIED' ? 'Verified' : verificationDecisions?.[selected.id]?.state === 'PARTIAL' ? 'Partially verified' : verificationDecisions?.[selected.id]?.state === 'INVESTIGATE' ? 'Investigate' : 'Not verified'}")

          # MSP surface receives decisions from App and never fetches per-passport decisions.
          replace('src/components/MSPCommandCenter.tsx', "import { apiFetch } from '../utils/apiClient';", "import { apiFetch } from '../utils/apiClient';\nimport type { VerificationDecision } from '../lib/verification/evaluateVerification';")
          replace('src/components/MSPCommandCenter.tsx', "  onNavigate: (tab: string) => void;\n}", "  onNavigate: (tab: string) => void;\n  verificationDecisions?: Record<string, VerificationDecision>;\n  verificationDetails?: Record<string, unknown>;\n}")
          replace('src/components/MSPCommandCenter.tsx', "export default function MSPCommandCenter({ clients, alerts, findings, role = 'Viewer', onSelectClient, onNavigate }: Props) {", "export default function MSPCommandCenter({ clients, alerts, findings, role = 'Viewer', onSelectClient, onNavigate, verificationDecisions = {}, verificationDetails = {} }: Props) {")
          if 'verificationDecisions?.[item.passportId]' not in Path('src/components/MSPCommandCenter.tsx').read_text():
              p=Path('src/components/MSPCommandCenter.tsx'); s=p.read_text(); s=s.replace("  const canAssign = role === 'Owner' || role === 'Admin';", "  const canAssign = role === 'Owner' || role === 'Admin';\n  const trustStateFromDecision = (decision?: VerificationDecision) => decision?.state ?? 'UNINITIALIZED';\n  const trustStateForPassportItem = (item: { passportId: string }) => trustStateFromDecision(verificationDecisions?.[item.passportId]);\n  const passportDecision = (passport: { id: string }) => { const decision = verificationDecisions?.[passport.id]; return decision; };"); p.write_text(s)
          PY
      - name: Verify
        run: npm ci && npm run typecheck && npm test -- --run && npm run build
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows src server.ts tests
          git diff --cached --check
          git commit -m "repair: verification integration" || exit 0
          git push origin main
