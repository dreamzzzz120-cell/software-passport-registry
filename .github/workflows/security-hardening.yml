name: Security Hardening Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      # See scripts/audit-with-retry.mjs: retries only an unreachable npm audit
      # endpoint, never a finding, and fails closed if no report is produced.
      - name: Dependency audit
        run: node scripts/audit-with-retry.mjs --omit=dev --audit-level=high
