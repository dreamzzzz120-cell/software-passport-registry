name: Wire traffic telemetry
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8f4b7c0e2f5e8c2f1f6d4e4f6e7f1f5f0d5f7f3a # v4
        with:
          fetch-depth: 1
      - name: Wire route
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.ts')
          s=p.read_text()
          imp="import { createTrafficRouter } from './src/routes/traffic.ts';"
          if imp not in s:
              marker="import { createMcpTransport } from './src/mcp/transport.ts';"
              if marker not in s: raise SystemExit('server import marker missing')
              s=s.replace(marker, imp+'\n'+marker, 1)
          mount="app.use('/api/traffic', createTrafficRouter());"
          if mount not in s:
              marker="app.use('/api', createScansRouter());"
              if marker not in s: raise SystemExit('server route marker missing')
              s=s.replace(marker, mount+'\n'+marker, 1)
          p.write_text(s)
          PY
      - name: Validate
        run: npm ci && npm run typecheck && npm test -- --run
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git diff --cached --quiet || git commit -m 'feat: wire first-party traffic telemetry'
          git push
