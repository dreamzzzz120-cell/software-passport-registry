name: Apply hardened scan UX integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v5

      - name: Integrate live scan progress UI
        shell: python
        run: |
          from pathlib import Path
          import re

          scans = Path('src/components/ScansView.tsx')
          text = scans.read_text()

          if "./ScanProgressExperience" not in text:
              text = text.replace(
                  "import NewReviewIntake from './NewReviewIntake';",
                  "import NewReviewIntake from './NewReviewIntake';\nimport ScanProgressExperience from './ScanProgressExperience';"
              )

          if "const [currentJobId, setCurrentJobId]" not in text:
              text = text.replace(
                  "  const [scanCompleted, setScanCompleted] = useState(false);",
                  "  const [scanCompleted, setScanCompleted] = useState(false);\n  const [currentJobId, setCurrentJobId] = useState<string | null>(() => {\n    try { return window.localStorage.getItem('spr.activeScanJobId'); } catch { return null; }\n  });\n  const [currentScanTarget, setCurrentScanTarget] = useState('');"
              )

          if "const [currentJobId, setCurrentJobId]" not in text:
              raise SystemExit('job state insertion failed')

          pattern = re.compile(
              r"\n      // Start periodic real-evidence state polling.*?\n\n    } catch \(err: unknown\) {",
              re.S,
          )
          replacement = """
      setCurrentJobId(jobId);
      setCurrentScanTarget(matchedPassport.name);
      try { window.localStorage.setItem('spr.activeScanJobId', jobId); } catch {}

    } catch (err: unknown) {"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('legacy polling block not found')

          start = "          {/* Scanner Console / Progress indicator */}"
          end = "        {/* Right Column: Scan History List */}"
          if start in text and end in text:
              a = text.index(start)
              b = text.index(end, a)
              new_console = """          {currentJobId && (
            <ScanProgressExperience
              jobId={currentJobId}
              targetName={currentScanTarget}
              onComplete={async () => {
                setIsScanning(false);
                setScanCompleted(true);
                setCurrentJobId(null);
                try { window.localStorage.removeItem('spr.activeScanJobId'); } catch {}
                const refreshScansRes = await apiFetch('/api/scans');
                if (refreshScansRes.ok) {
                  const updatedScans = await refreshScansRes.json();
                  const compiledScan = updatedScans[0];
                  if (compiledScan) onTriggerNewScan(compiledScan);
                }
              }}
            />
          )}

"""
              text = text[:a] + new_console + text[b:]
          else:
              raise SystemExit('legacy console markers not found')

          marker = "  useEffect(() => {\n    fetchSchedules();\n  }, []);"
          if marker in text and "Restore an in-flight scan" not in text:
              text = text.replace(marker, marker + "\n\n  // Restore an in-flight scan after navigation/reload; the job remains server-side.\n  useEffect(() => {\n    if (!currentJobId) return;\n    setIsScanning(true);\n    setScanCompleted(false);\n  }, [currentJobId]);\n")

          text = re.sub(r"\n  const \[scanProgress, setScanProgress\] = useState\(0\);", "", text, count=1)
          text = re.sub(r"\n  const \[scanLogs, setScanLogs\] = useState<string\[\]>\(\[\]\);", "", text, count=1)
          text = text.replace("    setScanProgress(0);\n", "")
          text = text.replace("    setScanLogs([`[INFO] Locating software trust record for \\\"${targetName}\\\"...`]);\n", "")
          text = re.sub(r"\n    setScanLogs\(l => \[.*?\n    \]\);", "", text, count=1, flags=re.S)
          text = re.sub(r"\n      setScanLogs\(l => \[\.\.\.l, `\[ERROR\].*?\n      return;", "\n      return;", text, count=1, flags=re.S)
          text = re.sub(r"\n    setScanLogs\(l => \[\.\.\.l, `\[ERROR\].*?\n      setIsScanning\(false\);", "\n      setIsScanning(false);", text, count=1, flags=re.S)
          text = text.replace("setScanProgress(0);", "setCurrentJobId(null);")
          text = text.replace("try { window.localStorage.removeItem('spr.activeScanJobId'); } catch {}\n                    }}", "try { window.localStorage.removeItem('spr.activeScanJobId'); } catch {}\n                    }}")

          scans.write_text(text)

          progress = Path('src/components/ScanProgressExperience.tsx')
          p = progress.read_text()
          old = """        if (terminal.has(next.status)) {
          finished = true;
          if (!completedRef.current) {
            completedRef.current = true;
            onCompleteRef.current?.(next);
          }
          return;
        }"""
          new = """        if (terminal.has(next.status)) {
          finished = true;
          if ((next.status === 'Success' || next.status === 'Completed') && !completedRef.current) {
            completedRef.current = true;
            onCompleteRef.current?.(next);
          }
          return;
        }"""
          if old in p:
              p = p.replace(old, new)
              progress.write_text(p)

      - name: Typecheck and test
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ScansView.tsx src/components/ScanProgressExperience.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: wire hardened scan progress into scanner"
          git push
