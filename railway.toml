[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm start"
# Config as Code overrides whatever is set in the Railway dashboard, so the
# provisioner has to be listed here or it silently stops running. It is what
# rotates the spr_app_runtime / spr_worker_runtime passwords in Postgres to
# match APP_RUNTIME_DB_PASSWORD / WORKER_RUNTIME_DB_PASSWORD, and while it was
# missing the worker crash-looped on "password authentication failed for user
# spr_worker_runtime". Both steps are idempotent.
preDeployCommand = ["node dist/migrate.cjs && node dist/provision-runtime-roles.cjs"]
healthcheckPath = "/health"
healthcheckTimeout = 180
restartPolicyType = "ALWAYS"
